services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guidway
      POSTGRES_PASSWORD: guidway
      POSTGRES_DB: guidway
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:

